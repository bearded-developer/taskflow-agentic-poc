name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-base:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Enforce PR target branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const baseRef = pr?.base?.ref || "";
            if (baseRef !== "develop") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  "Workflow policy violation: PR target branch must be `develop`.",
                  `Current target: \`${baseRef}\``,
                  "Please retarget this PR to `develop` and re-run checks.",
                ].join("\n"),
              });
              core.setFailed("PR base branch must be 'develop'.");
            }

  iteration-check:
    needs: validate-base
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      skip_review: ${{ steps.cap.outputs.skip_review }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @octokit/rest
      - id: cap
        run: node .github/scripts/iteration-cap.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HUMAN_FALLBACK_USER: ${{ vars.HUMAN_FALLBACK_USER }}

  review:
    needs: iteration-check
    if: needs.iteration-check.outputs.skip_review != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask Copilot to review PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = [
              "@copilot Please review this PR against the linked Jira story and approved plan.",
              "",
              "Requirements:",
              "- Follow .agent/reviewer-prompt.md and AGENTS.md.",
              "- Use findings-first format and include marker <!-- ai-reviewer-marker -->.",
              "- Validate correctness, completeness, tests, and security expectations.",
              "- If approved, post a separate comment that starts with: ✅ READY FOR HUMAN MERGE",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

  verify-verdict:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Ensure AI verdict marker exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const marker = "<!-- ai-reviewer-marker -->";
            const deadline = Date.now() + 8 * 60 * 1000;

            async function hasVerdictMarker() {
              const [reviews, comments] = await Promise.all([
                github.rest.pulls.listReviews({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100,
                }),
                github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100,
                }),
              ]);

              const inReviews = reviews.data.some((review) =>
                (review.body || "").includes(marker)
              );
              const inComments = comments.data.some((comment) =>
                (comment.body || "").includes(marker)
              );

              return inReviews || inComments;
            }

            let found = await hasVerdictMarker();
            while (!found && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 20000));
              found = await hasVerdictMarker();
            }

            if (!found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: [
                  "AI review gate failed: no verdict comment/review with marker found.",
                  "Expected marker: <!-- ai-reviewer-marker -->",
                  "Please ensure reviewer output is posted before merge.",
                ].join("\n"),
              });
              core.setFailed("No AI review verdict marker found before timeout.");
            }

  notify:
    needs: verify-verdict
    if: needs.verify-verdict.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check for approval and notify
        run: |
          echo "Review completed. Check PR for verdict."
          # Slack/Teams webhook call would go here. For POC, the PR
          # comment is sufficient — the demo focuses on the in-PR flow.