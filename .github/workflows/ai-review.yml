name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  iteration-check:
    runs-on: ubuntu-latest
    outputs:
      skip_review: ${{ steps.cap.outputs.skip_review }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save @octokit/rest
      - id: cap
        run: node .github/scripts/iteration-cap.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HUMAN_FALLBACK_USER: ${{ vars.HUMAN_FALLBACK_USER }}

  review:
    needs: iteration-check
    if: needs.iteration-check.outputs.skip_review != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask Copilot to review PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = [
              "@copilot Please review this PR against the linked Jira story and approved plan.",
              "",
              "Requirements:",
              "- Follow .agent/reviewer-prompt.md and AGENTS.md.",
              "- Use findings-first format and include marker <!-- ai-reviewer-marker -->.",
              "- Validate correctness, completeness, tests, and security expectations.",
              "- If approved, post a separate comment that starts with: ✅ READY FOR HUMAN MERGE",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

  notify:
    needs: review
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check for approval and notify
        run: |
          echo "Review completed. Check PR for verdict."
          # Slack/Teams webhook call would go here. For POC, the PR
          # comment is sufficient — the demo focuses on the in-PR flow.