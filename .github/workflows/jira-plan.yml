name: Jira Planning

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  plan:
    if: >-
      contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve Jira key from issue body
        id: jira
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const match = body.match(/\b[A-Z][A-Z0-9]+-\d+\b/);
            if (!match) {
              core.setFailed("No Jira key found in issue body.");
              return;
            }
            core.setOutput("key", match[0]);

      - name: Fetch Jira issue
        id: fetch
        run: node .github/scripts/fetch-jira.js
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira.outputs.key }}

      - name: Ask Copilot to create plan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const jiraJson = `${{ steps.fetch.outputs.jira_json }}`;
            const jiraUrl = `${{ steps.fetch.outputs.jira_url }}`;

            const body = [
              "@copilot Please generate the Development Plan for this issue.",
              "",
              "Constraints:",
              "- Copilot-only workflow. No external orchestrator.",
              "- Follow AGENTS.md and .github/copilot-instructions.md.",
              "- Use template from .agent/planner-prompt.md.",
              "- Include marker <!-- ai-plan-marker --> exactly once.",
              "- Keep scope strictly to Jira acceptance criteria.",
              "",
              `Jira URL: ${jiraUrl}`,
              "Jira payload:",
              "```json",
              jiraJson,
              "```",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
